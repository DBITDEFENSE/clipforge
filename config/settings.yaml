# ClipForge settings. Secrets live in .env, never here.

claude:
  model: claude-opus-5-5          # newest Opus; writing, mining, ranking
  effort_mine: high
  effort_write: high
  # Cyber topics can trip safety classifiers; "default" lets the API re-run a
  # declined request on a fallback model inside the same call.
  fallbacks: default
  max_parallel: 5
  # USD per 1M tokens, for data/costs.csv
  price_in: 4.00
  price_out: 20.00

plan:
  per_day: 5
  per_video: 3                    # best N stories from each video in a batch (total = max(per_day*days, per_video*videos))
  days: 1
  timezone: America/New_York
  slots: ["09:00", "12:00", "15:00", "18:00", "21:00"]   # daily posting times (ET)
  niche_weights: { cyber: 1.0, tech: 0.8, ai: 0.8, gaming: 0.6, other: 0.3 }

script:
  min_words: 110
  max_words: 160

transcribe:
  model: large-v3
  language: en
  batch_size: 16

voice:
  provider: elevenlabs            # elevenlabs | say (Windows built-in, for testing only) | take (takes/<short_id>.wav)
  model_id: eleven_v4             # most expressive EL model as of 2026-11; eleven_multilingual_v2 also works
  output_format: mp3_44100_192
  stability: 0.35                 # lower = more expressive (creator energy); raise if takes get wobbly
  similarity_boost: 0.85
  style: 0.35
  speed: 1.05
  tail_ms: 450                    # breathing room after the last word

video:
  fps: 30
  width: 1080
  height: 1920
  min_shot_ms: 1500
  max_shot_ms: 2400               # lean fast (spec: 1.5-3s); snapping lands shots at <= ~2.7s
  # Platform UI zones (fraction of height) that captions/cards must avoid.
  safe_top: 0.10
  safe_bottom: 0.20

finish:
  target_lufs: -14.0              # TikTok/Reels/Shorts all normalize near -14 LUFS integrated
  true_peak: -1.5
  music_gain_db: -16
  crf: 15

qa:
  min_duration_s: 25
  max_duration_s: 75
  lufs_tolerance: 1.5

publish:
  platforms: [youtube, tiktok]    # which ones the approve dialog pre-selects (only connected ones are used)
  ai_disclosure: true             # label as AI-generated / synthetic (AI voice + generated visuals). Both platforms ask for this.

ads:                              # recommendations only; ClipForge never spends money
  min_age_hours: 24
  min_views: 1500
  min_engagement: 0.04            # (likes+comments+shares)/views
  lift: 1.5                       # x your median views
  test_daily_usd: 20
  test_days: 3
