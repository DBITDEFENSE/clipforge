<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipForge Studio</title>
<style>
:root{--bg:#07080C;--panel:#10121A;--panel2:#171A25;--line:#ffffff12;--line2:#ffffff24;--text:#F5F7FB;--muted:#8E96AA;
--accent:#00E5FF;--accent2:#FF2D87;--hi:#E8FF3A;--bad:#FF4D3D;--ok:#3DF2A6;--warn:#FFB020;--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
a{color:var(--accent)}button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:32px;letter-spacing:-.025em;margin:0 0 6px;line-height:1.15}h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px}
h3{margin:0;font-size:17px}.sub{color:var(--muted);margin:0 0 24px;max-width:760px}.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;background:var(--accent);color:#0a0a0a;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.35;cursor:not-allowed}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}.btn.alt{background:var(--accent2);color:#fff}
.btn.bad{background:transparent;color:var(--bad);border:1px solid #FF4D3D55}.btn.sm{padding:7px 12px;border-radius:10px;font-size:13px}.btn.big{padding:15px 24px;font-size:16px;border-radius:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
textarea,input[type=text],input[type=password],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
label.f{display:block;font-weight:700;margin:16px 0 6px}label.f small{color:var(--muted);font-weight:400}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 11.5px ui-monospace,Consolas,monospace;padding:4px 9px;border-radius:8px;background:#ffffff0e;color:var(--muted);white-space:nowrap}
.pill.ok{background:#3DF2A61c;color:var(--ok)}.pill.bad{background:#FF4D3D22;color:var(--bad)}.pill.warn{background:#FFB02022;color:var(--warn)}.pill.ac{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:19px;letter-spacing:-.02em;white-space:nowrap}.logo b{color:var(--accent)}
nav{display:flex;gap:2px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none;padding:9px 14px;border-radius:11px;font-weight:650}
nav a.on{background:var(--panel2);color:var(--text)}nav a .n[hidden]{display:none}nav a .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:9px;background:var(--accent2);color:#fff;font-size:11px;text-align:center}
.me{position:relative}.chip{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:30px;border:1px solid var(--line2);cursor:pointer;background:var(--panel)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#000;flex:none}
.menu{position:absolute;right:0;top:46px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:6px;min-width:220px;display:none;box-shadow:0 20px 60px #000a}
.menu.on{display:block}.menu a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--text);text-decoration:none;cursor:pointer}.menu a:hover{background:var(--panel2)}
.jobmini{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}.jobmini b{color:var(--hi)}
main{max-width:1240px;margin:0 auto;padding:30px 24px 90px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:30px}.login .wrap{width:min(860px,100%);text-align:center}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:30px}
.prof{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 16px;cursor:pointer;transition:.15s;text-align:center}
.prof:hover{border-color:var(--line2);transform:translateY(-2px)}.prof .av{width:72px;height:72px;font-size:30px;margin:0 auto 14px}
.prof.new{border-style:dashed;color:var(--muted)}
/* home */
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;position:relative}
.step .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--panel2);color:var(--muted);font-size:14px}
.step.done .num{background:var(--ok);color:#000}.step.todo .num{background:var(--accent);color:#000}.step.warn .num{background:var(--warn);color:#000}
.step p{margin:0;color:var(--muted);font-size:14px}.step .btn{align-self:flex-start;margin-top:auto}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:18px 0}.pipe div{padding:12px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
.pipe div b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px}.pipe .on{border-color:var(--hi);color:var(--text);box-shadow:0 0 0 1px var(--hi) inset}.pipe .past{opacity:.55}
.pipe .past b::after{content:" ✓";color:var(--ok)}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);transition:.15s}.drop.over{border-color:var(--accent);color:var(--text)}
.log{background:#000;border:1px solid var(--line);border-radius:12px;padding:12px;font:12px/1.45 ui-monospace,Consolas,monospace;color:#b9c2d3;white-space:pre-wrap;max-height:320px;overflow:auto}
.jobs{display:flex;flex-direction:column;gap:8px}.job{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer}
.dot{width:9px;height:9px;border-radius:5px;background:var(--muted);flex:none}.dot.running{background:var(--hi);box-shadow:0 0 10px var(--hi);animation:p 1s infinite}.dot.done{background:var(--ok)}.dot.failed{background:var(--bad)}
@keyframes p{50%{opacity:.35}}
/* review */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card video{width:100%;aspect-ratio:9/16;background:#000;display:block}.card .b{padding:14px;display:flex;flex-direction:column;gap:9px;flex:1}
.card .t{font-weight:800;font-size:15px;line-height:1.3}.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
details summary{cursor:pointer;color:var(--accent);font-size:13px}details .txt{white-space:pre-wrap;color:#c9cfdb;font-size:13px;margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}.tab{padding:7px 14px;border-radius:20px;border:1px solid var(--line2);cursor:pointer;color:var(--muted);font-weight:650;background:none}.tab.on{background:var(--text);color:#000;border-color:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-8px 0 18px}
/* calendar */
.day{margin-bottom:18px}.day h3{margin:0 0 8px;font-size:15px}.slot{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:6px}
.slot.empty{opacity:.45}.slot .tm{font:700 14px ui-monospace,Consolas,monospace;color:var(--accent)}.slot.past .tm{color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;background:#000B;z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}
.modal.on{display:flex}.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:22px;width:min(980px,100%);display:grid;grid-template-columns:300px 1fr;overflow:hidden}
.sheet.narrow{grid-template-columns:1fr;width:min(520px,100%)}.sheet video{width:100%;height:100%;object-fit:cover;background:#000;min-height:420px}.sheet .body{padding:24px;max-height:calc(100vh - 60px);overflow:auto}
.plat{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;background:var(--panel2)}.plat h4{margin:0;display:flex;gap:10px;align-items:center;font-size:15px;justify-content:space-between}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;color:#d5dae4}.chk input{width:17px;height:17px;accent-color:var(--accent)}.chk.dis{opacity:.4}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}.note.w{color:var(--warn)}.consent{font-size:13px;color:#d5dae4;margin-top:12px;padding:10px 12px;border-radius:10px;background:#ffffff08}
/* settings */
.set{display:grid;grid-template-columns:220px 1fr;gap:26px}.side a{display:block;padding:10px 14px;border-radius:11px;color:var(--muted);text-decoration:none;font-weight:650;cursor:pointer}.side a.on{background:var(--panel2);color:var(--text)}
.swatches{display:flex;gap:14px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.sw input{width:58px;height:58px;border:2px solid var(--line2);border-radius:14px;background:none;padding:0;cursor:pointer}
.voice{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);margin-bottom:8px}
.voice.cur{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi) inset}.voice audio{grid-column:1/-1;width:100%;height:34px}
.cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
code{background:#ffffff12;padding:2px 6px;border-radius:6px;font-size:12.5px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--hi);color:#000;font-weight:800;padding:12px 20px;border-radius:12px;z-index:30;display:none;max-width:90vw}.toast.err{background:var(--bad);color:#fff}
.empty{padding:44px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
.banner{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:14px;background:#FFB02014;border:1px solid #FFB02044;margin-bottom:22px}
@media (max-width:900px){.hero,.set{grid-template-columns:1fr}.sheet{grid-template-columns:1fr}.sheet video{min-height:0;max-height:50vh}.top{flex-wrap:wrap;gap:10px}.pipe{grid-template-columns:repeat(3,1fr)}.cards2{grid-template-columns:1fr}.jobmini{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGE = {};
let ME = null, S = {shorts: [], jobs: [], slots: []}, C = null, V = null, ADS = [], tab = 'home', filter = 'pending', openJob = null, setTab = 'channel', lastRender = '';
const toast = (m, err) => { const t = $('#toast'); t.textContent = m; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 6500 : 3000); };
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && j.auth) { ME = null; showLogin(); throw new Error('Signed out'); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const fmtSlot = iso => iso ? new Date(iso).toLocaleString([], {weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: S.tz || 'America/New_York'}) + ' ET' : '';
const initials = n => (n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const avatar = (a, cls = '') => `<div class="av ${cls}" style="background:${esc(a.brand?.colors?.accent || '#00E5FF')}">${esc(initials(a.name))}</div>`;

/* ================= sign in ================= */
async function showLogin() {
  const {accounts} = await (await fetch('/api/accounts')).json();
  document.documentElement.style.cssText = '';
  $('#app').innerHTML = `<div class="login"><div class="wrap">
    <div class="logo" style="font-size:24px">Clip<b>Forge</b> Studio</div>
    <h1 style="margin-top:26px">Which channel are you working on?</h1><p class="muted">Each channel has its own look, voice, persona, schedule and connected accounts.</p>
    <div class="profiles">${accounts.map(a => `<div class="prof" onclick="pick('${a.id}', ${a.has_password})">${avatar(a)}<b>${esc(a.name)}</b><div class="muted small">${esc(a.handle || '')}${a.has_password ? ' · 🔒' : ''}</div></div>`).join('')}
      <div class="prof new" onclick="newChannel()"><div class="av" style="background:var(--panel2);color:var(--muted);font-size:34px">+</div><b>New channel</b></div></div>
  </div></div>`;
}
async function pick(id, locked) {
  let password = '';
  if (locked) { password = prompt('Password for this channel:'); if (password === null) return; }
  try { await api('/api/login', {id, password}); boot(); } catch (e) { toast(e.message, true); }
}
function newChannel() {
  $('#sheet').className = 'sheet narrow';
  $('#sheet').innerHTML = `<div class="body"><h1 style="font-size:24px">New channel</h1><p class="sub">You can change all of this later in Settings.</p>
    <label class="f">Channel name</label><input type="text" id="nc-name" placeholder="Cyber Cowboy">
    <label class="f">Handle <small>shown in the corner of every video</small></label><input type="text" id="nc-handle" placeholder="@yourhandle">
    <label class="f">Starting style</label><select id="nc-style"><option value="cyber-cowboy">Cyber Cowboy: funny, fast, practitioner take, light western flavor</option><option value="default">Plain cyber news: fast, deadpan, no theme</option></select>
    <label class="f">Password <small>optional, protects this channel in the studio</small></label><input type="password" id="nc-pw">
    <div class="row" style="margin-top:20px"><button class="btn" onclick="createChannel()">Create channel</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div></div>`;
  $('#modal').classList.add('on');
}
async function createChannel() {
  try { const a = await api('/api/accounts', {name: $('#nc-name').value, handle: $('#nc-handle').value, style: $('#nc-style').value, password: $('#nc-pw').value});
    closeModal(); await api('/api/login', {id: a.id, password: $('#nc-pw')?.value || ''}).catch(() => {}); boot(); } catch (e) { toast(e.message, true); }
}
async function logout() { await fetch('/api/logout', {method: 'POST'}); ME = null; showLogin(); }

/* ================= shell ================= */
async function boot() {
  try { ME = await api('/api/me'); } catch (e) { return; }
  const c = ME.brand_resolved?.colors || {};
  const r = document.documentElement.style;
  if (c.accent) r.setProperty('--accent', c.accent); if (c.accent2) r.setProperty('--accent2', c.accent2); if (c.highlight) r.setProperty('--hi', c.highlight);
  $('#app').innerHTML = `<div class="top"><div class="logo">${esc(ME.name)} <b>Studio</b></div>
    <nav id="nav">${[['home', 'Home'], ['make', 'Make'], ['review', 'Review'], ['calendar', 'Calendar'], ['results', 'Results'], ['settings', 'Settings']].map(([k, l]) =>
      `<a href="#${k}" data-t="${k}">${l}${k === 'review' ? '<span class="n" id="n-review" hidden></span>' : ''}</a>`).join('')}</nav>
    <div class="grow"></div><div class="jobmini" id="jobmini"></div>
    <div class="me"><div class="chip" onclick="$('#menu').classList.toggle('on')">${avatar(ME)}<b>${esc(ME.name)}</b> ▾</div>
      <div class="menu" id="menu"><a onclick="showLogin()">⇄ Switch channel</a><a onclick="location.hash='settings';$('#menu').classList.remove('on')">⚙ Channel settings</a><a onclick="logout()">⎋ Sign out</a></div></div></div>
    <main id="main"></main>`;
  route(); refresh();
}
async function refresh() {
  if (!ME) return;
  try { S = await api('/api/state'); } catch (e) { return; }
  const pending = S.shorts.filter(s => s.review === 'pending' && s.video).length;
  const n = $('#n-review'); if (n) { n.hidden = !pending; n.textContent = pending; }
  const running = S.jobs.find(j => j.status === 'running');
  const jm = $('#jobmini'); if (jm) jm.innerHTML = running ? `<b>●</b> ${esc(running.label)}` : '';
  render();
}
function route() {
  if (!ME) return;
  const h = location.hash.slice(1) || 'home'; tab = h.split('?')[0];
  const qs = new URLSearchParams(h.split('?')[1] || '');
  if (qs.get('ok')) { toast(`${qs.get('ok') === 'youtube' ? 'YouTube' : 'TikTok'} connected`); C = null; setTab = 'platforms'; history.replaceState(null, '', '#settings'); tab = 'settings'; }
  if (qs.get('err')) { toast('Connect failed: ' + qs.get('err'), true); setTab = 'platforms'; history.replaceState(null, '', '#settings'); tab = 'settings'; }
  if (tab === 'connect') { tab = 'settings'; setTab = 'platforms'; }
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
  lastRender = ''; render();
  if (tab === 'settings' || tab === 'home') loadConn();
  if (tab === 'results') loadAds();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => { if (!e.target.closest('.me')) $('#menu')?.classList.remove('on'); });
let afterHooks = [];
function render() {
  const main = $('#main'); if (!main) return;
  const fn = {home: vHome, make: vMake, review: vReview, calendar: vCalendar, results: vResults, settings: vSettings}[tab] || vHome;
  const html = fn();
  if (html === lastRender) return;
  const a = document.activeElement;
  if (a && ['TEXTAREA', 'INPUT', 'SELECT'].includes(a.tagName) && main.contains(a)) return;
  if ([...main.querySelectorAll('video,audio')].some(v => !v.paused)) return;
  const keep = {}; main.querySelectorAll('textarea[id], input[type=text][id]').forEach(el => { if (el.value) keep[el.id] = el.value; });
  lastRender = html; main.innerHTML = html;
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el && !el.value) el.value = v; }
  afterHooks.forEach(f => f()); afterHooks = [];
}

/* ================= Home ================= */
function vHome() {
  const waiting = S.shorts.filter(s => s.review === 'pending' && s.video).length;
  const preview = S.shorts.filter(s => s.voice_preview && s.review !== 'rejected').length;
  const conn = C ? ['youtube', 'tiktok'].filter(p => C[p]?.connected) : [];
  const next = S.slots.find(x => x.short_id && !x.past); const nextShort = next && S.shorts.find(s => s.id === next.short_id);
  const running = S.jobs.find(j => j.status === 'running');
  const step = (n, state, title, body, btn) => `<div class="step ${state}"><div class="row"><div class="num">${state === 'done' ? '✓' : n}</div><h3>${title}</h3></div><p>${body}</p>${btn || ''}</div>`;
  return `<h1>Howdy, ${esc(ME.name)} 👋</h1><p class="sub">Here's where things stand. Work left to right: make shorts, review them, schedule them, and the studio posts them for you.</p>
  ${preview ? `<div class="banner">⚠️<div class="grow"><b>${preview} short${preview > 1 ? 's have' : ' has'} a placeholder voice.</b> <span class="muted">Pick a voice in Settings → Voice (the local one is free), then hit <b>Re-voice</b> on each short.</span></div></div>` : ''}
  <div class="steps">
    ${step(1, S.shorts.length ? 'done' : 'todo', 'Make shorts', S.shorts.length ? `${S.shorts.length} made so far. Paste more links any time.` : 'Paste a YouTube/X/TikTok link. ClipForge finds the stories and makes original shorts.', `<a class="btn sm" href="#make">Make shorts</a>`)}
    ${step(2, waiting ? 'todo' : (S.shorts.length ? 'done' : ''), 'Review', waiting ? `<b style="color:var(--text)">${waiting} waiting</b> for you to approve, regenerate or reject.` : 'Nothing waiting.', waiting ? `<a class="btn sm" href="#review">Review ${waiting}</a>` : '')}
    ${step(3, conn.length ? 'done' : 'todo', 'Connect accounts', conn.length ? `Posting to ${conn.map(p => p === 'youtube' ? 'YouTube' : 'TikTok').join(' + ')}.` : 'Link YouTube and TikTok so approved shorts post themselves.', `<a class="btn sm ${conn.length ? 'ghost' : ''}" href="#settings" onclick="setTab='platforms'">${conn.length ? 'Manage' : 'Connect'}</a>`)}
    ${step(4, next ? 'done' : '', 'Scheduled', next ? `Next post <b style="color:var(--text)">${esc(fmtSlot(next.slot))}</b>: ${esc(nextShort?.title || '')}` : 'Approve a short to fill your next slot.', `<a class="btn sm ghost" href="#calendar">Open calendar</a>`)}
  </div>
  ${running ? `<h2>Working on</h2><div class="panel"><div class="row"><span class="dot running"></span><b class="grow">${esc(running.label)}</b><a class="btn sm ghost" href="#make" onclick="openJob='${running.id}'">Watch progress</a></div>${pipeHTML(STAGE[running.id])}</div>` : ''}
  <h2>Latest shorts</h2>${S.shorts.length ? `<div class="grid">${S.shorts.slice(0, 4).map(card).join('')}</div>` : '<div class="empty">No shorts yet. <a href="#make">Make your first batch →</a></div>'}`;
}

/* ================= Make ================= */
const STAGES = [['download', 'Download', 'grab the video'], ['transcribe', 'Transcribe', 'speech to text'], ['mine', 'Find stories', 'pick the best'], ['script', 'Write', 'script + edit pass'], ['voice', 'Voice', 'narration'], ['render', 'Animate', 'visuals + render + QA']];
function stageOf(log) {
  const marks = [['render', /\brender\b|\bdirect\b/], ['voice', /\bvoice\b/], ['script', /\bscript\b/], ['mine', /\bmine\b/], ['transcribe', /\btranscribe\b/], ['download', /\bdownload\b/]];
  const lines = (log || '').split('\n').reverse();
  for (const l of lines) for (const [k, re] of marks) if (re.test(l)) return k;
  return null;
}
function pipeHTML(stage) {
  const i = stage === 'done' ? STAGES.length : STAGES.findIndex(s => s[0] === stage);
  return `<div class="pipe">${STAGES.map(([k, t, d], j) => `<div class="${j === i ? 'on' : j < i ? 'past' : ''}"><b>${t}</b>${d}</div>`).join('')}</div>`;
}
function vMake() {

  afterHooks.push(() => { wireDrop(); if (job) loadLog(job.id); });
  return `<h1>Make shorts</h1><p class="sub">Drop in long videos as research. ClipForge pulls out the stories, writes new scripts in ${esc(ME.name)}'s voice, narrates them and animates original visuals. Each video gives you its best 3 stories.</p>

    <textarea id="urls" rows="5" placeholder="https://www.youtube.com/watch?v=..."></textarea>
    <div class="row" style="margin-top:14px"><button class="btn big" onclick="make()">▶ Make shorts</button>${S.inbox?.length ? `<span class="muted small">${S.inbox.length} uploaded file(s) waiting too</span>` : ''}</div>
    <div class="drop" id="drop" style="margin-top:18px">…or drop video files here · <a href="#" onclick="$('#file').click();return false">choose files</a><input type="file" id="file" accept="video/*" multiple hidden></div>
    <div id="upl" class="note"></div>
  </div><div class="panel"><h3 style="margin-bottom:12px">Jobs</h3>
    <div class="jobs">${S.jobs.length ? S.jobs.map(j => `<div class="job" onclick="openJob='${j.id}';lastRender='';render()"><span class="dot ${j.status}"></span><div class="grow">${esc(j.label)}<div class="note" style="margin:0">${j.status}${j.ended && j.started ? ` · ${Math.max(1, Math.round((j.ended - j.started) / 60))} min` : ''}</div></div></div>`).join('') : '<div class="muted small">Nothing yet. Jobs run one at a time; you can leave this page.</div>'}</div>

}
async function loadLog(id) {

async function make() {

function wireDrop() {

}

    : '<div class="empty">Nothing posted yet. Results show up here after your first posts go live.</div>'}
  <h2>Worth boosting with ads</h2><p class="sub" style="margin-top:-4px">Posts at least a day old that beat your usual views with strong engagement. ClipForge never spends money: you launch the boost and set the budget.</p>
  ${ADS.length ? `<div class="cards2">${ADS.map(a => `<div class="panel"><div class="row"><b class="grow">${esc(a.title)}</b><span class="pill ${a.status === 'boosted' ? 'ok' : 'ac'}">${esc(a.status)}</span></div>
    <div class="note">${a.platform} · ${a.views.toLocaleString()} views · ${(a.engagement * 100).toFixed(1)}% engagement · ${a.age_hours}h old</div>
    <div style="margin:10px 0">${a.why.map(w => `<span class="pill ok">${esc(w)}</span> `).join('')}</div><div class="note">Suggested test: ${esc(a.suggested)}</div>
    <div class="row" style="margin-top:12px">${a.url ? `<a class="btn sm ghost" href="${esc(a.url)}" target="_blank">View post</a>` : ''}<a class="btn sm" href="https://ads.tiktok.com/" target="_blank">TikTok Ads Manager ↗</a>
      ${a.status === 'boosted' ? `<span class="note">spend: $${a.spend ?? 0}</span>` : `<button class="btn sm alt" onclick="markAd('${a.short_id}','boosted')">I boosted it</button><button class="btn sm ghost" onclick="markAd('${a.short_id}','dismissed')">Not this one</button>`}</div></div>`).join('')}</div>`
    : '<div class="empty">No candidates yet. They appear once posts have a day of real numbers.</div>'}
  <details style="margin-top:18px"><summary>How to boost a winner on TikTok (Spark Ads)</summary><div class="txt">1. In the TikTok app: open the post → ⋯ → Ad settings → turn on "Ad authorization" → copy the code.
2. TikTok Ads Manager → Create campaign → objective Video views (or Traffic) → set the budget and schedule; start with a broad US 18+ audience.
3. Ad → "Use TikTok account to deliver Spark Ads" → paste the code → publish.
Start with the suggested test budget, then only raise spend on ads that keep a low cost per view.</div></details>`;
}
async function refreshStats() { try { const j = await api('/api/stats', {}); toast(`Pulled ${j.rows} stat rows`); await refresh(); loadAds(); } catch (e) { toast(e.message, true); } }
async function markAd(id, status) { let spend = null; if (status === 'boosted') { const v = prompt('How much are you spending (USD)? Just for tracking.', '60'); if (v === null) return; spend = parseFloat(v) || 0; }
  try { await api('/api/ads/mark', {id, status, spend}); loadAds(); } catch (e) { toast(e.message, true); } }

/* ================= Settings ================= */
async function loadConn() { try { C = await api('/api/connections'); lastRender = ''; render(); } catch (e) {} }
async function loadVoices() { try { V = await api('/api/voices'); lastRender = ''; render(); } catch (e) { V = {error: e.message}; lastRender = ''; render(); } }
function vSettings() {
  const side = [['channel', 'Channel'], ['voice', 'Voice'], ['platforms', 'YouTube & TikTok'], ['security', 'Password']];
  const body = {channel: sChannel, voice: sVoice, platforms: sPlatforms, security: sSecurity}[setTab] || sChannel;
  return `<h1>Settings</h1><p class="sub">Everything here applies to <b>${esc(ME.name)}</b> only.</p>
  <div class="set"><div class="side">${side.map(([k, l]) => `<a class="${setTab === k ? 'on' : ''}" onclick="setTab='${k}';lastRender='';render()">${l}</a>`).join('')}</div><div>${body()}</div></div>`;
}
function sChannel() {
  const c = ME.brand_resolved?.colors || {};
  const sw = (k, l) => `<label class="sw"><input type="color" id="col-${k}" value="${esc(c[k] || '#000000')}">${l}</label>`;
  return `<div class="panel"><h3>Channel</h3>
    <label class="f">Name</label><input type="text" id="ch-name" value="${esc(ME.name)}">
    <label class="f">Handle <small>shown in the corner of every video</small></label><input type="text" id="ch-handle" value="${esc(ME.handle || '')}">
    <label class="f">Persona <small>how scripts sound: tone, angle, audience, running jokes. The writer follows this.</small></label><textarea id="ch-persona" rows="9">${esc(ME.persona || '')}</textarea>
    <label class="f">Colors <small>used in videos, covers and this studio</small></label><div class="swatches">${sw('accent', 'Main')}${sw('accent2', 'Second')}${sw('highlight', 'Highlight')}${sw('bg', 'Background')}${sw('warning', 'Danger')}</div>
    <label class="f">Posting times <small>Eastern, comma-separated, 24h</small></label><input type="text" id="ch-slots" value="${esc((ME.slots || []).join(', '))}">
    <div class="row" style="margin-top:18px"><button class="btn" onclick="saveChannel()">Save changes</button><span class="note">New and regenerated shorts use the new look.</span></div></div>`;
}
async function saveChannel() {
  const colors = {}; ['accent', 'accent2', 'highlight', 'bg', 'warning'].forEach(k => colors[k] = $('#col-' + k).value.toUpperCase());
  try { await api('/api/account', {name: $('#ch-name').value, handle: $('#ch-handle').value, persona: $('#ch-persona').value, colors,
      slots: $('#ch-slots').value.split(',').map(s => s.trim()).filter(Boolean)}); toast('Saved'); boot(); } catch (e) { toast(e.message, true); }
}
let LV = null, LVsel = null;
async function loadLocal() { try { LV = await api('/api/voices/local'); LVsel = LVsel || {...LV.config}; lastRender = ''; render(); } catch (e) { LV = {error: e.message}; } }
const DRAWL_NAMES = {off: 'No accent', light: 'Light country', full: 'Full cowboy drawl'};
function slider(key, label, min, max, step, fmt, hint) {
  return `<div><label class="f">${label} <small>${fmt(LVsel[key])}${hint ? ' · ' + hint : ''}</small></label>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${LVsel[key]}" style="width:100%;accent-color:var(--accent)" oninput="this.previousElementSibling.querySelector('small').textContent=(${fmt.toString()})(parseFloat(this.value))+'${hint ? ' · ' + hint : ''}'" onchange="LVsel['${key}']=parseFloat(this.value);lastRender='';render()"></div>`;
}
function sVoice() {
  if (!LV) { loadLocal(); return '<div class="panel">Loading voices…</div>'; }
  if (LV.error) return `<div class="panel note w">${esc(LV.error)}</div>`;
  const usingLocal = LV.provider === 'kokoro', sel = LVsel;
  const same = JSON.stringify(Object.keys(sel).sort().map(k => [k, String(sel[k])])) === JSON.stringify(Object.keys(LV.config).sort().map(k => [k, String(LV.config[k])]));
  const opt = (cur, allowNone) => (allowNone ? `<option value="" ${!cur ? 'selected' : ''}>None</option>` : '') + LV.voices.map(v => `<option value="${v.id}" ${v.id === cur ? 'selected' : ''}>${esc(v.desc)}</option>`).join('');
  const sampleUrl = '/sample-local?cfg=' + encodeURIComponent(JSON.stringify(sel));
  return `<div class="panel"><div class="row"><h3 class="grow">Local voice <span class="pill ok">free · unlimited · runs on your GPU</span></h3>${usingLocal && same ? '<span class="pill ok">in use</span>' : (usingLocal ? '<span class="pill warn">unsaved changes</span>' : '')}</div>
    <p class="note" style="margin:6px 0 4px">Start from a preset, tweak, press play to hear it, then save. Like ElevenLabs' sliders, but free.</p>
    <label class="f">Presets</label><div class="row" style="gap:8px">${Object.keys(LV.presets).map(n => `<button class="btn sm ghost" onclick="LVsel={...LV.presets['${n}']};lastRender='';render()">${esc(n)}</button>`).join('')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 18px">
      <div><label class="f">Narrator</label><select onchange="LVsel.kokoro_voice=this.value;lastRender='';render()">${opt(sel.kokoro_voice)}</select></div>
      <div><label class="f">Blend with <small>mix in a second voice</small></label><select onchange="LVsel.blend_voice=this.value;if(!this.value)LVsel.blend=0;else if(!LVsel.blend)LVsel.blend=0.4;lastRender='';render()">${opt(sel.blend_voice, true)}</select></div>
      ${sel.blend_voice ? slider('blend', 'Blend amount', 0, 1, 0.05, v => Math.round(v * 100) + '% second voice') : '<div></div>'}
      ${slider('speed', 'Pace', 0.8, 1.15, 0.01, v => v.toFixed(2) + 'x', 'lower = slower drawl')}
      ${slider('pitch', 'Pitch', -4, 3, 0.5, v => (v > 0 ? '+' : '') + v + ' semitones', 'lower = deeper')}
      ${slider('warmth', 'Warmth / grit', 0, 1, 0.05, v => Math.round(v * 100) + '%', 'body + a little rasp')}
      ${slider('expressive', 'Expressiveness', 0, 1, 0.05, v => Math.round(v * 100) + '%', 'more = livelier pacing')}
      ${slider('pause', 'Pause between sentences', 0, 0.4, 0.02, v => v.toFixed(2) + 's')}
    </div>
    <label class="f">Accent</label>
    <div class="tabs" style="margin:0">${LV.drawls.map(d => `<button class="tab ${sel.drawl === d ? 'on' : ''}" onclick="LVsel.drawl='${d}';lastRender='';render()">${DRAWL_NAMES[d] || d}</button>`).join('')}</div>
    <label class="f">Hear it <small>takes a second for new settings</small></label><audio controls preload="none" src="${sampleUrl}" style="width:100%"></audio>
    <div class="row" style="margin-top:16px"><button class="btn" ${usingLocal && same ? 'disabled' : ''} onclick="useLocal()">${usingLocal && same ? 'Saved' : 'Use this voice for ' + esc(ME.name)}</button>
      <button class="btn ghost" onclick="LVsel={...LV.config};lastRender='';render()">Reset</button></div>
  </div>
  <details style="margin-top:18px"><summary>ElevenLabs voices (paid credits)</summary><div style="margin-top:12px">${sVoiceEL()}</div></details>`;
}
async function useLocal() {
  try { await api('/api/account', {local_voice: LVsel}); toast('Voice saved. New and re-voiced shorts use it.'); LV = null; loadLocal(); } catch (e) { toast(e.message, true); }
}
function sVoiceEL() {
  if (!V) { loadVoices(); return '<div class="note">Loading…</div>'; }
  if (V.error) return `<p class="note w">${esc(V.error)}</p>`;
  return V.voices.map(v => `<div class="voice ${v.id === V.current && LV?.provider === 'elevenlabs' ? 'cur' : ''}"><div><b>${esc(v.name)}</b>${v.pick ? ' <span class="pill ac">good fit</span>' : ''}<div class="note" style="margin:2px 0 0">${esc(v.desc || '')}</div></div>
      <div class="row"><button class="btn sm ghost" onclick="useVoice('${v.id}')">Use</button></div>
      ${v.sample ? `<audio controls preload="none" src="/sample/${v.id}.mp3"></audio>` : `<button class="btn sm ghost" style="grid-column:1/-1;justify-self:start" onclick="genSample(this,'${v.id}')">▶ Generate sample (~65 credits)</button>`}</div>`).join('');
}
async function useVoice(id) { try { await api('/api/account', {voice_id: id}); V.current = id; LV = null; toast('ElevenLabs voice set for ' + ME.name); loadLocal(); } catch (e) { toast(e.message, true); } }
async function genSample(b, id) { b.textContent = 'Generating…'; const r = await fetch('/sample/' + id + '.mp3'); if (!r.ok) { const j = await r.json().catch(() => ({})); b.textContent = 'Failed'; toast((j.error || '').includes('quota') ? 'ElevenLabs is out of credits' : (j.error || 'failed'), true); return; }
  b.outerHTML = `<audio controls autoplay src="/sample/${id}.mp3" style="grid-column:1/-1;width:100%"></audio>`; V.voices.forEach(v => { if (v.id === id) v.sample = true; }); }
function sPlatforms() {
  if (!C) return '<div class="panel">Loading…</div>';
  const copy = t => `<button class="btn sm ghost" onclick="navigator.clipboard.writeText('${t}');toast('Copied')">copy</button>`;
  const yt = C.youtube, tt = C.tiktok;
  return `<div class="cards2">
  <div class="panel"><div class="row"><h3 class="grow">▶ YouTube</h3>${yt.connected ? `<span class="pill ok">connected${C.channel?.title ? ' · ' + esc(C.channel.title) : ''}</span>` : '<span class="pill">not connected</span>'}</div>
    ${yt.connected ? `<div class="row" style="margin-top:14px"><button class="btn sm ghost" onclick="disc('youtube')">Disconnect</button></div>`
    : yt.configured ? `<p class="note">Sign in with the Google account that owns ${esc(ME.name)}'s YouTube channel.</p><a class="btn" href="/oauth/youtube/start">Connect YouTube</a>`
    : `<p class="note">One-time setup (about 10 min), shared by all your channels:</p><ol class="small" style="color:#c9cfdb;padding-left:18px"><li><a href="https://console.cloud.google.com/projectcreate" target="_blank">Create a Google Cloud project</a></li>
      <li>Enable <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank">YouTube Data API v3</a></li><li>OAuth consent screen → External → add your Google account as a test user</li>
      <li>Credentials → Create OAuth client ID → <b>Desktop app</b> → paste below</li></ol>
      <label class="f">Client ID</label><input type="text" id="k-gid"><label class="f">Client secret</label><input type="text" id="k-gsec">
      <div class="row" style="margin-top:12px"><button class="btn" onclick="saveKeys('g')">Save</button></div>`}</div>
  <div class="panel"><div class="row"><h3 class="grow">♪ TikTok</h3>${tt.connected ? '<span class="pill ok">connected</span>' : '<span class="pill">not connected</span>'}</div>
    ${tt.connected ? `<div class="row" style="margin-top:14px"><button class="btn sm ghost" onclick="disc('tiktok')">Disconnect</button></div>`
    : tt.configured ? `<p class="note">Make sure this redirect URI is in your TikTok app: <code>${esc(tt.redirect)}</code> ${copy(tt.redirect)}</p><a class="btn" href="/oauth/tiktok/start">Connect TikTok</a>`
    : `<p class="note">One-time setup, shared by all your channels:</p><ol class="small" style="color:#c9cfdb;padding-left:18px"><li><a href="https://developers.tiktok.com/apps" target="_blank">developers.tiktok.com → Manage apps</a> → Connect an app</li>
      <li>Add <b>Login Kit</b> (platform: Desktop) and <b>Content Posting API</b> (Direct Post on)</li><li>Scopes: <code>user.info.basic</code> <code>video.publish</code> <code>video.list</code></li>
      <li>Redirect URI: <code>${esc(tt.redirect)}</code> ${copy(tt.redirect)}</li><li>Paste the client key and secret below. Until TikTok audits the app, posts are private only.</li></ol>
      <label class="f">Client key</label><input type="text" id="k-tkey"><label class="f">Client secret</label><input type="text" id="k-tsec">
      <div class="row" style="margin-top:12px"><button class="btn" onclick="saveKeys('t')">Save</button></div>`}</div>
  <div class="panel"><h3>Pipeline keys</h3><div class="row" style="gap:6px;margin-top:10px"><span class="pill ${C.anthropic ? 'ok' : 'bad'}">Claude ${C.anthropic ? '✓' : '✗'}</span><span class="pill ${C.elevenlabs ? 'ok' : 'bad'}">ElevenLabs ${C.elevenlabs ? '✓' : '✗'}</span><span class="pill ${C.pexels ? 'ok' : ''}">Stock B-roll ${C.pexels ? '✓' : '(optional)'}</span></div>
    <p class="note">Change these with <code>uv run clipforge setup</code>.</p></div></div>`;
}
function sSecurity() {
  return `<div class="panel"><h3>Password</h3><p class="note">${ME.has_password ? 'This channel is password-protected in the studio.' : 'No password: anyone using this PC can open this channel.'}</p>
    <label class="f">New password <small>leave empty and save to remove</small></label><input type="password" id="pw1">
    <div class="row" style="margin-top:14px"><button class="btn" onclick="savePw()">Save password</button></div></div>`;
}
async function savePw() { try { await api('/api/account', {password: $('#pw1').value}); toast($('#pw1').value ? 'Password set' : 'Password removed'); ME = await api('/api/me'); lastRender = ''; render(); } catch (e) { toast(e.message, true); } }
async function saveKeys(w) {
  const body = w === 'g' ? {GOOGLE_CLIENT_ID: $('#k-gid').value, GOOGLE_CLIENT_SECRET: $('#k-gsec').value} : {TIKTOK_CLIENT_KEY: $('#k-tkey').value, TIKTOK_CLIENT_SECRET: $('#k-tsec').value};
  if (Object.values(body).some(v => !v.trim())) return toast('Paste both values', true);
  try { await api('/api/keys', body); toast('Saved'); loadConn(); } catch (e) { toast(e.message, true); }
}
async function disc(p) { if (!confirm('Disconnect ' + p + ' from ' + ME.name + '?')) return; await api('/api/disconnect', {platform: p}); loadConn(); }

/* ================= start ================= */
(async () => { const r = await fetch('/api/me'); if (r.status === 401) showLogin(); else boot(); })();
setInterval(refresh, 3000);
setInterval(() => { if (tab === 'make' || tab === 'home') { const j = S.jobs.find(x => x.id === openJob) || S.jobs.find(x => x.status === 'running'); if (j && j.status === 'running') loadLog(j.id); } }, 2500);
</script>
</body>
</html>
